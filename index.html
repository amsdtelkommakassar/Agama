<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Petualangan PAI: Negeri Padang Pasir (Voxel)</title><meta name="color-scheme" content="light dark">

<style>

/* ---- tampilan dialog materi (rapi & mudah dibaca) ---- */

.b{font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,.18)}

.p{border:2px solid rgba(199,125,26,.55)}

.gb:hover{filter:brightness(1.08)}
.gb:focus-visible,.seg button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.gold{background:linear-gradient(#ffe07a,#f3a622);color:#4a2504;box-shadow:0 5px 0 #a35a12,0 8px 16px #0007;font-size:21px;padding:14px}
.gold:active{transform:translateY(4px);box-shadow:0 1px 0 #a35a12}
.teal{background:linear-gradient(#45d3bf,#18998a);color:#04332d;box-shadow:0 5px 0 #0b5f54,0 8px 16px #0007}

.dark{background:#ffffff1c;color:#ffe9b8;border:2px solid #f1b94d88;box-shadow:0 4px 0 #0006;font-size:15px;padding:10px 6px}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;align-items:center;gap:4px;background:#0005;border-radius:12px;padding:4px}
.seg span{padding:0 8px;font-size:13px;color:#ffd98a;font-weight:700}
.seg button{flex:1;font:700 13.5px 'Baloo 2','Segoe UI',sans-serif;border:0;border-radius:9px;padding:7px 4px;background:transparent;color:#ffe9b8;cursor:pointer}
.seg button.on{background:#f3a622;color:#4a2504}
.bd{display:flex;justify-content:center;gap:8px}
.bd i{font-style:normal;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:#0006;border:2px solid #8a5a1f;filter:grayscale(1) brightness(.55)}

@media(max-height:520px) and (orientation:landscape){#start .tw{flex-direction:row;max-width:900px;gap:22px}.lg{flex:1}.lg p,.lg svg{display:none}.mp{flex:0 0 min(46vw,400px);padding:12px;gap:6px}.gold{padding:10px}.gb{font-size:16px}.dark{padding:8px 4px}}
/* adegan panduan */
#cn{position:fixed;inset:0;z-index:9;display:none;pointer-events:none;font-family:'Baloo 2','Trebuchet MS','Segoe UI',Arial,sans-serif;color:#fff4d6}

#cL{font-size:13px;color:#8ee6d8;font-weight:700;margin-bottom:5px}
#cS{margin:0;font-size:clamp(14px,3.6vw,16.5px);line-height:1.45}
#cX{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#cX:empty{display:none}
#cX span{background:#ffffff1c;border:1px solid #f1b94d77;border-radius:10px;padding:2px 9px;font-size:13px;font-weight:600}

#cp:after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:#ffd36b}
#cn .ct{position:absolute;right:calc(8px + env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:6px}

#cn .ct .sk{width:auto;border-radius:20px;padding:0 14px;font:700 14px 'Baloo 2','Segoe UI',sans-serif}
</style></head><body>

<h1>PETUALANGAN PAI</h1><div class="rb">Negeri Padang Pasir</div><p>Temui warga, pelajari materi PAI BAB 1–5, dan kumpulkan 6 lencana.</p></header>

<script>
"use strict";
const $=i=>document.getElementById(i),T=THREE,rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
/* ===== DATA MATERI (sumber: Kisi-Kisi SAS PAI BAB 1–5) ===== */
/* ===== TANYA JAWAB MAJELIS ILMU ===== */
const QA=[[["Apa isi Q.S. Al-'Alaq ayat 1–5?","alaq isi wahyu iqra baca","Ayat 1–5 adalah wahyu pertama yang memerintahkan kita membaca dengan menyebut nama Tuhan yang menciptakan."],["Di mana wahyu pertama diterima?","hira gua dimana tempat","Nabi Muhammad saw. menerima wahyu pertama saat beribadah di Gua Hira."],["Apa hikmah perintah membaca?","hikmah membaca ilmu belajar","Membaca adalah salah satu cara memperoleh ilmu. Belajar tidak hanya saat ada tugas atau ujian."]],
[["Apa itu sifat wajib Allah?","wajib pasti sifat","Sifat yang pasti dimiliki Allah, contoh: Wujud (ada), Qidam (terdahulu), Baqa' (kekal), Wahdaniyah (Esa)."],["Apa itu sifat mustahil?","mustahil lawan adam","Sifat yang tidak mungkin ada pada Allah, yaitu lawan sifat wajib. Lawan Wujud adalah Adam (tidak ada)."],["Apa itu sifat jaiz?","jaiz bebas kehendak","Allah bebas melakukan atau tidak melakukan sesuatu sesuai kehendak-Nya."]],
[["Apa arti Al-Wahhab?","wahhab pemberi rezeki nikmat","Maha Pemberi. Semua rezeki dan nikmat berasal dari Allah; kita bersyukur dan meneladani dengan suka memberi."],["Apa arti Al-Baqa'?","baqa kekal abadi","Maha Kekal: Allah tidak pernah binasa."],["Apa itu Fana?","fana binasa mati makhluk","Fana artinya akan binasa. Semua makhluk pada akhirnya mati, hanya Allah yang kekal."]],
[["Apa kandungan Q.S. Al-Isra' ayat 23?","isra ayat orang tua ibu","Perintah berbuat baik dan menghormati orang tua, misalnya membantu ibu dan mendengarkan nasihatnya."],["Bagaimana bersikap jika ditegur ibu?","tegur ibu marah maaf nasihat","Dengarkan nasihat dan minta maaf dengan sopan; jangan membantah atau menyimpan marah."],["Bagaimana cara menghormati guru?","guru hormat adab sapa bantu","Sapa dengan sopan, bantu bila perlu, tunggu penjelasan selesai sebelum membantu teman, dan jangan berkata kasar."]],
[["Apa pengertian puasa?","pengertian puasa niat fajar magrib","Menahan diri dari hal yang membatalkan, disertai niat, sejak terbit fajar hingga terbenam matahari."],["Siapa yang wajib berpuasa?","syarat wajib islam balig berakal","Orang yang Islam, balig, dan berakal sehat."],["Apa yang membatalkan puasa?","batal membatalkan makan minum sengaja lupa","Makan atau minum dengan sengaja. Jika karena lupa, puasa tetap sah."],["Bagaimana puasa orang sakit?","sakit qada ganti","Orang sakit berat boleh tidak berpuasa, lalu menggantinya sesuai ketentuan (qada)."],["Apa sunah puasa dan hikmahnya?","sunah berbuka hikmah sabar peduli pahala","Sunah: menyegerakan berbuka. Hikmah: sabar, mengendalikan hawa nafsu, peduli sesama. Berbohong dan menggunjing mengurangi pahala."]],

{t:"Wahyu Pertama",b:"Q.S. Al-'Alaq 1–5",who:0,badge:"📖 Lencana Pembaca",
mat:"Q.S. Al-'Alaq ayat 1–5 adalah wahyu pertama, diterima Nabi Muhammad saw. di Gua Hira. Isinya perintah membaca (Iqra') dengan menyebut nama Tuhan yang menciptakan.\nHikmahnya: membaca dan belajar adalah jalan memperoleh ilmu pengetahuan, dan itu tidak hanya dilakukan saat ada tugas atau ujian.",
task:"Temukan 1 Lembaran Ilmu di dekat Gua Hira, lalu kembali ke Ustaz Hira.",items:[[-88,38,"Lembaran Ilmu"]],
q:[["Wahyu pertama di Gua Hira memerintahkan manusia membaca. Hikmah yang dapat diambil adalah ...",["Belajar hanya saat ada tugas guru","Membaca adalah salah satu cara memperoleh ilmu","Orang pandai membaca tak perlu belajar hal lain","Mencari ilmu cukup saat akan ujian"],1,"Perintah membaca mengajarkan bahwa membaca adalah jalan memperoleh ilmu."],
["Rani sulit memahami pelajaran, lalu membaca ulang buku dan bertanya kepada guru. Ini sesuai kandungan Q.S. ...",["Al-Fatihah: selalu berdoa","Al-Ikhlas: keesaan Allah","Al-'Alaq: pentingnya membaca dan belajar","An-Nas: berlindung kepada Allah"],2,"Q.S. Al-'Alaq mengajarkan pentingnya membaca dan belajar."]]},
{t:"Sifat-Sifat Allah Swt.",b:"Sifat wajib, mustahil, jaiz",who:1,badge:"🌟 Lencana Pengenal Allah",
mat:"Sifat wajib: sifat yang pasti dimiliki Allah Swt., misalnya Wujud (ada), Qidam (terdahulu), Baqa' (kekal), Wahdaniyah (Esa).\nSifat mustahil: lawan sifat wajib, tidak mungkin ada pada Allah, misalnya Adam (tidak ada).\nSifat jaiz: Allah bebas melakukan atau tidak melakukan sesuatu sesuai kehendak-Nya.",
task:"",items:[],
q:[["Allah memiliki sifat wajib Wujud. Sifat yang mustahil bagi Allah adalah ...",["Adam, karena Allah tidak mungkin tidak ada","Baqa', karena Allah tidak mungkin kekal","Qidam, karena Allah tidak mungkin terdahulu","Wahdaniyah, karena Allah tidak mungkin Esa"],0,"Lawan Wujud (ada) adalah Adam (tidak ada)."],
["Allah bebas melakukan sesuatu atau tidak melakukannya sesuai kehendak-Nya. Ini menunjukkan sifat ...",["Mustahil, karena Allah tidak dapat berbuat","Wajib, karena semua perbuatan harus dilakukan","Jaiz, karena Allah bebas berbuat atau tidak","Fana, karena perbuatan Allah akan berakhir"],2,"Sifat jaiz berarti Allah bebas berbuat atau tidak berbuat."]]},
{t:"Asmaul Husna",b:"Al-Wahhab, Al-Baqa', Fana",who:2,badge:"💎 Lencana Pemurah",
mat:"Al-Wahhab artinya Maha Pemberi. Semua rezeki dan nikmat berasal dari Allah, maka kita bersyukur dan meneladani dengan suka memberi.\nAl-Baqa' artinya Maha Kekal: Allah tidak binasa.\nFana artinya akan binasa: semua makhluk pada akhirnya mati.",
task:"",items:[],
q:[["Dina mendapat sepeda baru dari orang tua dan sadar rezeki berasal dari Allah. Sikap sesuai Al-Wahhab adalah ...",["Memamerkan sepeda agar dipuji","Bersyukur kepada Allah dan memakai sepeda dengan baik","Merasa sepeda hasil usahanya sendiri","Melarang siapa pun mendekati sepedanya"],1,"Al-Wahhab: semua rezeki dari Allah, jadi kita bersyukur."],
["(1) Allah kekal, tidak binasa. (2) Semua makhluk akan mati. (3) Allah memberi banyak nikmat. Pasangan yang tepat ...",["1 Al-Wahhab, 2 Al-Baqa'","1 Al-Baqa', 2 Fana, 3 Al-Wahhab","1 Fana, 2 Al-Wahhab, 3 Al-Baqa'","1 Al-Kabir, 2 Al-Wahhab, 3 Fana"],1,"Kekal = Al-Baqa', binasa = Fana, pemberi nikmat = Al-Wahhab."],
["Arman memberi sebagian makanannya kepada teman yang tidak membawa bekal. Perilaku ini menunjukkan ...",["Manusia sama persis dengan Allah","Arman meneladani Al-Wahhab dengan suka memberi","Arman tak boleh menikmati makanannya","Semua makanan harus diberikan ke orang lain"],1,"Suka memberi adalah teladan dari makna Al-Wahhab."]]},
{t:"Berbakti kepada Orang Tua & Guru",b:"Q.S. Al-Isra' ayat 23, adab",who:3,badge:"💛 Lencana Anak Saleh",
mat:"Q.S. Al-Isra' ayat 23 memerintahkan kita berbuat baik dan menghormati orang tua: membantu ibu, mendengarkan nasihat, dan meminta maaf dengan sopan bila bersalah.\nKepada guru: hormati, sapa dengan sopan, bantu bila perlu, dan jangan berkata kasar. Ilmu harus disertai akhlak yang baik.",
task:"",items:[],
q:[["Ibu meminta diambilkan air; Adi segera berhenti bermain dan membantu. Sesuai Q.S. Al-Isra' ayat 23 karena ...",["Anak harus selalu meninggalkan kegiatannya","Anak diperintahkan menghormati dan berbuat baik kepada orang tua","Anak membantu hanya jika diberi hadiah","Anak harus mengerjakan semua pekerjaan sendiri"],1,"Al-Isra' ayat 23: berbuat baik dan hormat kepada orang tua."],
["Riko tidak sengaja salah dan ditegur ibu. Sikap yang paling tepat adalah ...",["Membantah karena merasa benar","Pergi tanpa meminta maaf","Mendengarkan nasihat ibu dan meminta maaf dengan sopan","Diam tetapi menyimpan marah"],2,"Terima nasihat orang tua dan minta maaf dengan sopan."],
["Seorang siswa pintar tetapi sering berkata kasar kepada gurunya. Menurut Islam ...",["Kepandaian lebih penting daripada kesopanan","Ilmu harus disertai sikap hormat dan akhlak baik","Siswa pandai boleh berbicara sesukanya","Hormat hanya untuk siswa kurang pandai"],1,"Ilmu harus disertai hormat dan akhlak baik."],
["Siska bertemu gurunya di pasar yang sedang membawa banyak barang. Sikap hormat yang tepat ...",["Pura-pura tidak kenal","Menyapa sopan dan menawarkan bantuan","Memanggil guru keras dari jauh","Menunggu guru menyapa lebih dulu"],1,"Hormat kepada guru: menyapa sopan dan suka menolong."],
["Saat guru menjelaskan, Beni melihat temannya kesulitan. Ia ingin membantu tanpa mengganggu guru. Tindakan terbaik ...",["Langsung berbicara dengan temannya saat guru menjelaskan","Mengabaikan temannya","Menunggu guru selesai menjelaskan, lalu membantu temannya","Meminta temannya keluar kelas"],2,"Hormati guru: tunggu penjelasan selesai, lalu bantu teman."]]},
{t:"Puasa Ramadan",b:"Ketentuan, sunah, pembatal, hikmah",who:4,badge:"🌙 Lencana Ahli Puasa",
mat:"Puasa: menahan diri dari hal yang membatalkan, disertai niat, sejak terbit fajar hingga terbenam matahari.\nSyarat wajib: Islam, balig, berakal. Orang sakit berat boleh tidak berpuasa lalu menggantinya (qada).\nSunah: menyegerakan berbuka. Makan/minum karena lupa tidak membatalkan; sengaja minum membatalkan. Berbohong dan menggunjing mengurangi pahala.\nHikmah: sabar, mengendalikan hawa nafsu, peduli sesama.",
task:"Menjelang Magrib! Ambil 1 Kurma dan 1 Air Segar di Oasis, lalu kembali untuk berbuka bersama.",items:[[44,-26,"Kurma"],[62,-24,"Air Segar"]],
q:[["Farhan Islam, balig, berakal. Rudi Islam tetapi belum balig. Bima Islam, balig, tetapi kehilangan akal. Yang wajib berpuasa ...",["Farhan, karena Islam, balig, dan berakal","Rudi, karena Islam sudah cukup","Bima, karena balig lebih penting","Ketiganya"],0,"Syarat wajib puasa: Islam, balig, berakal."],
["Saat azan Magrib, Zahra segera berbuka dengan kurma dan air. Ini adalah ...",["Syarat wajib puasa","Sunah menyegerakan berbuka","Perbuatan yang membuat puasa tidak sah","Kewajiban mengganti puasa"],1,"Menyegerakan berbuka adalah sunah."],
["Dito lupa sedang berpuasa lalu minum; setelah ingat ia berhenti. Hukum puasanya ...",["Batal","Tetap sah karena dilakukan dalam keadaan lupa","Batal dan wajib fidyah","Tidak sah"],1,"Makan/minum karena lupa tidak membatalkan puasa."],
["Nanda sangat haus lalu sengaja minum air putih tanpa uzur. Akibatnya ...",["Tetap sah karena air bukan makanan","Puasanya batal karena minum dengan sengaja","Tetap sah jika segera berhenti","Makruh tetapi tidak batal"],1,"Minum dengan sengaja membatalkan puasa."],
["Rafi lapar melihat makanan lezat tetapi tetap bersabar. Puasa melatih manusia untuk ...",["Menghindari semua makanan","Mengendalikan hawa nafsu dan bersabar","Tidak punya keinginan makan","Menunda makan berhari-hari"],1,"Hikmah puasa: mengendalikan hawa nafsu dan bersabar."],
["Rina membagikan makanannya kepada tetangga yang tidak punya makanan berbuka. Hikmah puasa yang tampak ...",["Menumbuhkan kepedulian dan kasih sayang kepada sesama","Membiasakan mengurangi makan","Orang berpuasa harus selalu memberi makanan","Melatih diri tak butuh bantuan orang lain"],0,"Puasa menumbuhkan kepedulian sosial."],
["Fajar berniat puasa sejak malam, lalu menahan makan dan minum sejak terbit fajar hingga terbenam matahari. Ini pengertian puasa, yaitu ...",["Menahan lapar sejak bangun tidur sampai Zuhur","Menahan diri dari hal yang membatalkan puasa disertai niat sejak terbit fajar hingga terbenam matahari","Tidak makan dan minum hanya di sekolah","Mengurangi makan siang tanpa berniat"],1,"Puasa = menahan diri dari pembatal, dengan niat, dari fajar sampai Magrib."],
["Pak Hasan sakit berat dan dokter menyarankan agar tidak berpuasa. Sikap yang sesuai ajaran Islam ...",["Tetap berpuasa","Tidak berpuasa dan menggantinya sesuai ketentuan agama","Tidak berpuasa dan tidak perlu menggantinya","Mengganti puasa dengan hadiah untuk anak-anak"],1,"Orang sakit boleh tidak berpuasa, tetapi wajib menggantinya (qada)."],
["Hasan diejek temannya dan marah, tetapi ingat bahwa ia sedang berpuasa. Tindakan terbaik ...",["Membalas ejekan agar temannya takut","Membentak temannya","Bersabar dan menghindari pertengkaran","Membatalkan puasa karena marah"],2,"Orang berpuasa menjaga akhlak: bersabar dan menghindari pertengkaran."],
["Kegiatan: 1 membaca Al-Qur'an, 2 menggunjing teman, 3 membantu orang tua, 4 berbohong kepada guru, 5 memberi makanan berbuka kepada tetangga. Yang mengurangi pahala puasa ...",["1 dan 3","2 dan 4","1 dan 5","3 dan 5"],1,"Menggunjing dan berbohong mengurangi pahala puasa."],
["Setelah puasa Ramadan sebulan, perubahan perilaku yang paling menunjukkan keberhasilan puasa ...",["Lebih sabar, jujur, disiplin, dan peduli kepada sesama","Lebih senang membeli makanan dalam jumlah banyak","Merasa lebih baik daripada teman yang tidak berpuasa","Rajin ibadah hanya selama Ramadan"],0,"Puasa yang berhasil membentuk akhlak: sabar, jujur, disiplin, peduli."]]},
{t:"Masyarakat Arab Pra-Islam",b:"Ahlul Hadar & Badui, kebiasaan",who:5,badge:"🏜️ Lencana Penjelajah Sejarah",
mat:"Masyarakat Arab sebelum Islam terdiri dari dua kelompok. Ahlul Hadar: menetap di kota dan banyak berdagang. Ahlul Badui: hidup berpindah-pindah di padang pasir mencari air dan rumput untuk ternak.\nKebiasaan baik: menolong dan memuliakan tamu. Kebiasaan buruk: berjudi, mabuk-mabukan. Sebagian menyembah berhala (misalnya Latta), sebagian menganut Yahudi atau Nasrani.\nTeladan: contoh yang baik, hindari yang buruk sesuai ajaran Islam.",
task:"",items:[],
q:[["Sebagian Arab pra-Islam suka menolong dan menghormati tamu, sebagian berjudi dan mabuk. Kesimpulannya ...",["Semua berperilaku buruk","Mereka tidak mengenal aturan","Kehidupan mereka memiliki kebiasaan baik dan buruk","Semua sudah menjalankan Islam"],2,"Ada kebiasaan baik dan buruk pada masyarakat Arab pra-Islam."],
["Keluarga Salim tinggal di padang pasir dan berpindah-pindah mencari air dan rumput. Mereka termasuk ...",["Ahlul Hadar","Ahlul Badui","Kaum Quraisy di kota","Kaum pedagang"],1,"Hidup berpindah-pindah = Ahlul Badui."],
["Kelompok A menetap di kota dan berdagang. Kelompok B berpindah-pindah di padang pasir. Perbedaan yang tepat ...",["A Ahlul Badui, B Ahlul Hadar","A Ahlul Hadar, B Ahlul Badui","Keduanya Ahlul Hadar","Keduanya Ahlul Badui"],1,"Menetap di kota = Hadar; berpindah-pindah = Badui."],
["Sebagian Arab menyembah patung seperti Latta di sekitar Ka'bah. Ini bertentangan dengan Islam karena ...",["Islam mengajarkan banyak Tuhan","Islam mengajarkan menyembah Allah Swt. saja","Semua buatan manusia harus disembah","Manusia boleh menyembah apa pun"],1,"Islam mengajarkan menyembah Allah Swt. saja."],
["Damar tahu ada kebiasaan baik (menolong tamu) dan buruk (berjudi) pada masa jahiliah. Tindakan yang tepat ...",["Meniru semua kebiasaan","Menolak semua kebiasaan lama","Mencontoh yang baik dan menghindari yang buruk sesuai Islam","Berjudi boleh jika sudah tradisi"],2,"Ambil teladan yang baik, hindari yang buruk."],
["Ahmad membaca bahwa ada kelompok Arab yang menetap di kota dan bekerja sebagai pedagang. Kelompok itu disebut ...",["Ahlul Badui","Ahlul Hadar","Kaum Muhajirin","Kaum Ansar"],1,"Menetap di kota dan berdagang = Ahlul Hadar."],
